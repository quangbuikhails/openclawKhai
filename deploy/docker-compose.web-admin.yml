# Web app Biểu theo dõi, Lịch, Kanban (G4-02, G4-03, PLAN.md D47). Tệp đứng một mình, KHÔNG ghép với docker-compose.yml của OpenClaw.
# Bật: docker compose -p khai-pbs-web --env-file ~/apps/openclaw/.env -f deploy/docker-compose.web-admin.yml up -d --no-deps web-admin
# Project compose riêng khai-pbs-web (không có orphan, down hay --remove-orphans không chạm openclaw-gateway, khai-mcp-google). Đọc Google bằng khóa chỉ đọc. Đường ghi duy nhất: mạng khai-pbs-write (internal, do compose của mcp-google tạo, phải có trước) tới khai-mcp-google:3000/web/task-status bằng WEB_TOKEN (trong secrets/web-admin.env cùng WEB_ORIGIN); không vào khai-pbs_default, không mount secrets/mcp-google.env, không có MCP_GOOGLE_TOKEN, BRIEF_TOKEN.
services:
  web-admin:
    image: ${OPENCLAW_IMAGE:?đặt OPENCLAW_IMAGE trong ~/apps/openclaw/.env}
    container_name: khai-web-admin
    entrypoint: ["node", "/app/web-admin/server.mjs"]
    user: "1000:1000"
    restart: unless-stopped
    env_file:
      - ${HOME}/projects/khai-phien-ban-so/secrets/web-admin.env
    environment:
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ${HOME}/projects/khai-phien-ban-so/web-admin:/app/web-admin:ro
      # Gắn thư mục (không gắn tệp đơn lẻ), chỉ chứa khóa SA chỉ đọc.
      - ${HOME}/projects/khai-phien-ban-so/secrets/google-ro:/run/secrets:ro
    ports:
      - "127.0.0.1:28801:3000"
    networks: [web, write]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  web:
    name: khai-pbs-web
  write:
    name: khai-pbs-write
    external: true
