<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lịch công việc · Khải Phiên Bản Số</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<aside class="sidebar">
  <div class="brand"><span class="avatar">KS</span><div><strong>Khải Phiên Bản Số</strong><small>Bảng quản lý</small></div></div>
  <nav>
    <span class="nav-title">Việc của tôi</span>
    <a class="nav-item" href="/">Biểu theo dõi</a>
    <a class="nav-item active" href="/lich">Lịch công việc</a>
  </nav>
  <button id="logout" class="nav-item logout" type="button">Đăng xuất</button>
</aside>
<main>
  <header class="page-head">
    <h1>Lịch công việc</h1>
    <p class="sub">Mốc [Nhắc], [Hạn] lấy từ biểu theo dõi, cùng lịch hẹn trên lịch "Công việc" của Google Calendar. Trang này chỉ để xem.</p>
    <p class="sync"><span id="dot" class="dot"></span><span id="syncText">Đang tải…</span></p>
  </header>

  <section class="cal-bar">
    <div class="cal-nav">
      <button id="prev" class="btn" type="button" aria-label="Trước">‹</button>
      <h2 id="title"></h2>
      <button id="next" class="btn" type="button" aria-label="Sau">›</button>
      <button id="todayBtn" class="btn" type="button">Hôm nay</button>
    </div>
    <div class="seg" id="mode" role="group" aria-label="Màn xem"></div>
    <div class="cal-legend">
      <span class="pill hen">Lịch hẹn</span><span class="pill nhac">[Nhắc] ngày nhắc việc</span><span class="pill han">[Hạn] hạn hoàn thành</span>
    </div>
  </section>

  <div class="cal-layout">
    <div class="cal-main">
      <div id="grid" class="cal-grid"></div>
      <p id="note" class="muted"></p>
    </div>
    <aside class="cal-side">
      <section id="detail" class="side-card" hidden></section>
      <section id="upcoming" class="side-card desktop-only"><h3>7 ngày tới</h3><div id="upList"></div></section>
    </aside>
  </div>
</main>
<script src="/lich.js" type="module"></script>
</body>
</html>
