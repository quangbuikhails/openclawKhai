<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập · Khải Phiên Bản Số</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="login-page">
<main class="login-card">
  <div class="brand"><span class="avatar">KS</span><div><strong>Khải Phiên Bản Số</strong><small>Bảng quản lý</small></div></div>
  <form id="form" autocomplete="current-password">
    <label for="pw">Mật khẩu</label>
    <input id="pw" type="password" autocomplete="current-password" required maxlength="256" autofocus>
    <button type="submit" class="btn primary">Đăng nhập</button>
    <p id="msg" role="alert"></p>
  </form>
</main>
<script src="/login.js"></script>
</body>
</html>
